<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pantheon partner banner</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Manrope:wght@400;500;800&display=swap">
<style>
body{margin:0;font-family:'Manrope',system-ui,sans-serif}
</style>
</helmet>
<div style="width: 1280px; height: 440px; box-sizing: border-box; padding: 64px; background: #ffffff; display: flex; align-items: center">
<aside aria-label="Partnership" style="position: relative; overflow: hidden; width: 100%; box-sizing: border-box; display: flex; align-items: center; gap: 56px; padding: 40px 48px; border-radius: 12px; background: {{panel}}; color: #191819">
<svg aria-hidden="true" viewBox="0 0 200 320" style="position: absolute; right: -24px; top: -20px; height: 360px; width: auto" fill="#191819" fill-opacity="0.07"><path d="M130 0 L20 170 H92 L60 320 L190 130 H116 Z"/></svg>
<div style="position: relative; flex: none; width: 280px; box-sizing: border-box; padding: 24px; background: #ffffff; border-radius: 8px; border: 2px solid #191819">
<img src="/content/images/pantheon-partnership/pantheon-fast-forward-logo-lockup.png" alt="Pantheon and Fast Forward" style="display: block; width: 100%; height: auto">
</div>
<div style="position: relative; display: flex; flex-direction: column; gap: 14px; max-width: 620px">
<p style="margin: 0; display: inline-flex; align-items: center; gap: 10px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 500; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase"><span style="display: inline-block; width: 28px; height: 2px; background: #191819"></span>Partnership</p>
<p style="margin: 0; font-size: 44px; line-height: 1.1; font-weight: 800; letter-spacing: -0.02em">Built in partnership with Pantheon</p>
<p style="margin: 0; font-size: 18px; line-height: 1.5; font-weight: 500; max-width: 540px">We worked closely with Pantheon's engineering and product teams on the development and testing of this site.</p>
</div>
</aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"panel":{"editor":"color","default":"#ffdc28","options":["#ffdc28","#ffffff","#edf1f2","#008ca8"]},"$preview":{"width":1280,"height":440}}'>
class Component extends DCLogic {
renderVals() {
return { panel: this.props.panel ?? '#ffdc28' };
}
}
</script>
</body>
</html>
